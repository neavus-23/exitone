version: 2
updates:
  # Go module dependencies (go.mod/go.sum).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # charmbracelet/x/muesli/mattn are all TUI-rendering dependencies that
      # tend to release in lockstep (bubbletea/lipgloss pull in matching
      # x/* versions) — grouping avoids a wave of one-line PRs that all
      # touch the same handful of go.sum lines.
      tui-stack:
        patterns:
          - "github.com/charmbracelet/*"
          - "github.com/muesli/*"
          - "github.com/mattn/*"
          - "github.com/erikgeiser/*"
          - "github.com/lucasb-eyer/*"
          - "github.com/aymanbagabas/*"
          - "github.com/rivo/*"
          - "github.com/xo/*"
      sqlite-stack:
        patterns:
          - "modernc.org/*"

  # GitHub Actions workflow versions (actions/checkout, actions/setup-go, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
